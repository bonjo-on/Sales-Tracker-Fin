<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Target Tracker · Coronary &amp; Peripheral</title>
<style>
  :root{
    --bg:#F6F4EF; --panel:#FFFFFF; --ink:#1C2333; --inkSoft:#5B6478;
    --line:#E3E0D6; --navy:#1E3A5F; --steel:#4E7AA7; --amber:#B8863B;
    --good:#3F7A5A; --warn:#B8863B; --bad:#B24C4C; --coral:#C97B63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:28px 20px 60px;}
  h1{
    font-family:Georgia, 'Times New Roman', serif; font-size:32px; font-weight:400;
    margin:0; color:var(--navy);
  }
  .eyebrow{font-size:12px; letter-spacing:0.12em; color:var(--steel); font-weight:600; margin-bottom:6px;}
  .header-row{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
  .save-indicator{font-size:12px; color:var(--inkSoft); min-height:16px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px;}
  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px; padding:12px 16px;}
  .divider{width:1px; height:24px; background:var(--line);}
  .seg{display:flex; gap:4px;}
  .seg button{
    padding:6px 12px; font-size:13px; border-radius:7px; border:none; cursor:pointer;
    background:transparent; color:var(--inkSoft); font-weight:500;
  }
  .seg button.active{background:var(--navy); color:#fff; font-weight:600;}
  label.inline{font-size:13px; color:var(--inkSoft); display:flex; align-items:center; gap:6px;}
  select, input[type=number].ctrl{
    border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:13px; background:#fff; color:var(--ink);
  }
  input[type=number].ctrl{width:52px;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:12px; margin-bottom:20px;}
  .card .label{font-size:11.5px; color:var(--inkSoft); margin-bottom:6px; font-weight:600;}
  .card .value{font-family:Georgia, serif; font-size:26px; margin-bottom:4px;}
  .card .sub{font-size:11px; color:var(--inkSoft);}
  .mini-row{display:flex; gap:24px; flex-wrap:wrap; margin-bottom:20px;}
  .mini .label{font-size:11px; color:var(--inkSoft); margin-bottom:2px;}
  .mini .value{font-size:17px; font-weight:600;}
  .chart-panel{margin-bottom:24px;}
  .chart-title{font-size:13px; font-weight:600; color:var(--navy); margin-bottom:8px;}
  #chart{width:100%; height:260px;}
  .table-panel{margin-bottom:16px;}
  .table-title{font-size:13px; font-weight:600; color:var(--navy); margin-bottom:10px;}
  table{border-collapse:collapse; width:100%; font-size:12.5px;}
  th{padding:6px 8px; font-size:11px; color:var(--inkSoft); font-weight:600; text-align:center; border-bottom:1px solid var(--line); background:var(--bg);}
  th.current{background:#FBF0E4;}
  td{padding:6px 8px; text-align:center; border-bottom:1px solid var(--line);}
  td.label{text-align:left; font-weight:600; color:var(--navy); white-space:nowrap;}
  td.sep{border-top:2px solid var(--line);}
  td input{
    width:100%; box-sizing:border-box; text-align:center; border:1px solid transparent;
    border-radius:5px; padding:5px 2px; font-size:12.5px; font-family:inherit; font-weight:400;
    background:transparent; color:var(--ink);
  }
  td input:focus{border:1px solid var(--steel); outline:none; background:#fff;}
  td input::-webkit-outer-spin-button, td input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  td input[type=number]{ -moz-appearance:textfield; }
  .table-title .unit{font-weight:400; color:var(--inkSoft); font-size:12px; margin-left:4px;}
  .table-scroll{overflow-x:auto;}
  .gap-panel{margin-bottom:20px;}
  .gap-title{font-size:13px; font-weight:600; color:var(--navy); margin-bottom:2px;}
  .gap-sub{font-size:11.5px; color:var(--inkSoft); margin-bottom:12px;}
  .gap-summary{
    display:flex; align-items:baseline; gap:8px; margin-bottom:14px; padding:10px 14px;
    background:#FBF0EE; border:1px solid #EFD9D4; border-radius:8px;
  }
  .gap-summary .num{font-family:Georgia, serif; font-size:22px; color:var(--bad); font-weight:700;}
  .gap-summary .txt{font-size:12.5px; color:var(--inkSoft);}
  .gap-row{display:flex; align-items:center; gap:10px; margin-bottom:7px;}
  .gap-month{width:34px; font-size:11.5px; color:var(--inkSoft); font-weight:600;}
  .gap-track{flex:1; height:11px; background:var(--bg); border-radius:6px; overflow:hidden;}
  .gap-fill{height:100%; background:var(--bad); border-radius:6px;}
  .gap-num{width:78px; text-align:right; font-size:12px; color:var(--bad); font-weight:600;}
  .gap-empty{font-size:12.5px; color:var(--good); padding:6px 0;}
  .footnote{font-size:11.5px; color:var(--inkSoft); line-height:1.6;}
  .tabs-note{font-size:13px; color:var(--inkSoft);}
</style>
</head>
<body>
<div class="wrap">

  <div class="header-row">
    <div>
      <div class="eyebrow">2026 SALES TARGET</div>
      <h1>Coronary &amp; Peripheral Tracker</h1>
    </div>
    <div class="save-indicator" id="saveIndicator"></div>
  </div>

  <div class="panel controls">
    <div class="seg" id="segCategory"></div>
    <div class="divider"></div>
    <div class="seg" id="segCurrency"></div>
    <div class="divider"></div>
    <label class="inline">
      기준일
      <select id="asOfMonth"></select>
      <input type="number" class="ctrl" id="asOfDay" min="1" max="31" value="10">
      일
    </label>
  </div>

  <div class="cards" id="cards"></div>

  <div class="panel mini-row" id="miniRow"></div>

  <div class="panel gap-panel" id="gapPanel"></div>

  <div class="panel chart-panel">
    <div class="chart-title" id="chartTitle">월별 목표 vs 실적</div>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel table-panel">
    <div class="table-title" id="tableTitle">월별 실적 입력</div>
    <div id="tableArea"></div>
  </div>

  <div class="footnote">
    · YTD 페이스 = 실적 ÷ 동기간(경과 개월) 목표 — 실제 달성 속도를 보는 지표<br>
    · 연간 Ach% = 실적 ÷ 연간 총목표 — 참고용이며 하반기 미도래 예산까지 분모에 포함되어 낮게 나옴<br>
    · 일할 페이스 = 이번 달 실적 ÷ (이번 달 목표 × 경과일수/총일수) — 월 중간 리뷰용<br>
    · 이 파일은 브라우저(이 기기)의 로컬 저장소에 데이터를 저장합니다. 다른 기기·브라우저에서 열면 별도로 시작됩니다.
  </div>

</div>

<script>
// ---------- Data ----------
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];

const BUDGET = {
  coronary: {
    krw: [173306662,173306662,173306662,177186662,177186662,178479995,179773329,181066662,181066662,182359995,184946662,184946662],
    usd: [125065,125065,125065,127865,127865,128799,129732,130665,130665,131599,133465,133465],
    unit:[670,670,670,685,685,690,695,700,700,705,715,715],
  },
  peripheral: {
    krw: [45000000,40000000,40000000,45000000,40000000,40000000,45000000,40000000,40000000,45000000,40000000,40000000],
    usd: [36082,36082,36082,36082,36082,36082,36082,36082,36082,36082,36082,36082],
    unit:[450,400,400,450,400,400,450,400,400,450,400,400],
  }
};

const ASP_KRW = { coronary: 256500, peripheral: 124000 };

const SEED_ACTUAL = {
  coronary: {
    krw: [189610000,154090000,172730000,158580000,155520000,160830000,173770000,64740000,null,null,null,null],
    usd: [131779,107708,122234,104663,104977,107274,118164,45318,null,null,null,null],
    unit:[743,603,673,618,606,630,682,254,null,null,null,null],
  },
  peripheral: {
    krw: [0,0,6324000,40920000,25792000,46500000,49848000,27156000,null,null,null,null],
    usd: [0,0,4427,27007,17410,33897,19009,0,null,null,null,null],
    unit:[0,0,51,330,208,375,402,219,null,null,null,null],
  }
};

const STORAGE_KEY = "sales_target_tracker_actuals_v1";

let state = {
  actual: JSON.parse(JSON.stringify(SEED_ACTUAL)),
  category: "total",
  currency: "krw",
  asOfMonth: 7,
  asOfDay: 10,
};

// ---------- Load from localStorage ----------
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) state.actual = JSON.parse(saved);
} catch(e) { /* ignore */ }

function persist(){
  const ind = document.getElementById("saveIndicator");
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.actual));
    ind.textContent = "✓ 저장됨";
    setTimeout(()=>{ if(ind.textContent==="✓ 저장됨") ind.textContent=""; }, 1200);
  } catch(e) {
    ind.textContent = "저장 실패";
  }
}

// ---------- Helpers ----------
const fmtKRW = n => n==null ? "—" : Math.round(n).toLocaleString("ko-KR") + "원";
const fmtKRWPlain = n => n==null ? "—" : Math.round(n).toLocaleString("ko-KR");
const fmtUSD = n => n==null ? "—" : "$" + Math.round(n).toLocaleString("en-US");
const fmtInputNum = n => (n==null || n==="") ? "" : Math.round(n).toLocaleString("en-US");
const fmtInputUSD = n => (n==null || n==="") ? "" : "$" + Math.round(n).toLocaleString("en-US");
const fmtInputUnit = n => (n==null || n==="") ? "" : Math.round(n).toLocaleString("en-US") + "개";
const fmtUnit = n => n==null ? "—" : Math.round(n).toLocaleString("en-US") + "개";
const pct = (a,b) => (b===0||b==null) ? null : (a/b)*100;
const sum = arr => arr.reduce((s,v)=> s + (v||0), 0);
function paceColor(p){
  if(p==null) return "var(--inkSoft)";
  if(p>=100) return "var(--good)";
  if(p>=85) return "var(--warn)";
  return "var(--bad)";
}

function combinedBudget(){
  const out = {krw:[],usd:[],unit:[]};
  for(let i=0;i<12;i++){
    out.krw.push(BUDGET.coronary.krw[i]+BUDGET.peripheral.krw[i]);
    out.usd.push(BUDGET.coronary.usd[i]+BUDGET.peripheral.usd[i]);
    out.unit.push(BUDGET.coronary.unit[i]+BUDGET.peripheral.unit[i]);
  }
  return out;
}
function combinedActual(){
  const out = {krw:[],usd:[],unit:[]};
  const c = state.actual.coronary, p = state.actual.peripheral;
  for(let i=0;i<12;i++){
    const has = c.krw[i]!=null || p.krw[i]!=null;
    out.krw.push(has ? (c.krw[i]||0)+(p.krw[i]||0) : null);
    out.usd.push(has ? (c.usd[i]||0)+(p.usd[i]||0) : null);
    out.unit.push(has ? (c.unit[i]||0)+(p.unit[i]||0) : null);
  }
  return out;
}

// ---------- Render ----------
function render(){
  const category = state.category, currency = state.currency, asOfMonth = state.asOfMonth, asOfDay = state.asOfDay;
  const budgetSet = category === "total" ? combinedBudget() : BUDGET[category];
  const actualSet = category === "total" ? combinedActual() : state.actual[category];
  const cur = currency === "krw" ? fmtKRW : fmtUSD;
  const catLabel = {coronary:"Coronary", peripheral:"Peripheral", total:"Total"}[category];

  // Controls
  document.getElementById("segCategory").innerHTML = ["total:전체","coronary:Coronary","peripheral:Peripheral"].map(o=>{
    const [val,label]=o.split(":");
    return `<button class="${val===category?'active':''}" data-cat="${val}">${label}</button>`;
  }).join("");
  document.getElementById("segCurrency").innerHTML = ["krw:KRW","usd:USD"].map(o=>{
    const [val,label]=o.split(":");
    return `<button class="${val===currency?'active':''}" data-cur="${val}">${label}</button>`;
  }).join("");
  const asOfMonthSel = document.getElementById("asOfMonth");
  if(asOfMonthSel.options.length===0){
    MONTHS.forEach((m,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=m; asOfMonthSel.appendChild(o); });
  }
  asOfMonthSel.value = asOfMonth;
  document.getElementById("asOfDay").value = asOfDay;

  // Derived
  const annualBudget = sum(budgetSet[currency]);
  const ytdActual = sum(actualSet[currency].slice(0, asOfMonth+1));
  const ytdActualUnit = sum(actualSet.unit.slice(0, asOfMonth+1));
  const ytdBudget = sum(budgetSet[currency].slice(0, asOfMonth+1));
  const ytdBudgetUnit = sum(budgetSet.unit.slice(0, asOfMonth+1));
  const annualAch = pct(ytdActual, annualBudget);
  const ytdAch = pct(ytdActual, ytdBudget);
  const ytdAchUnit = pct(ytdActualUnit, ytdBudgetUnit);

  const dim = DAYS_IN_MONTH[asOfMonth];
  const dayFrac = Math.min(asOfDay, dim) / dim;
  const curMonthBudget = budgetSet[currency][asOfMonth] * dayFrac;
  const curMonthActual = actualSet[currency][asOfMonth];
  const curMonthPace = pct(curMonthActual, curMonthBudget);

  const aspActual = ytdActualUnit ? ytdActual/ytdActualUnit : null;
  const aspBudget = ytdBudgetUnit ? ytdBudget/ytdBudgetUnit : null;

  const remainingBudget = annualBudget - ytdActual;
  const monthsLeft = 12 - (asOfMonth+1);
  const originalRemainingBudget = sum(budgetSet[currency].slice(asOfMonth+1));
  const requiredVsOriginal = originalRemainingBudget ? (remainingBudget/originalRemainingBudget)*100 : null;

  // Cards
  document.getElementById("cards").innerHTML = `
    <div class="panel card">
      <div class="label">YTD 페이스 (${catLabel})</div>
      <div class="value" style="color:${paceColor(ytdAch)}">${ytdAch==null?"—":ytdAch.toFixed(1)+"%"}</div>
      <div class="sub">실적 ${cur(ytdActual)} / 목표 ${cur(ytdBudget)} (동기간)</div>
    </div>
    <div class="panel card">
      <div class="label">연간 Ach% (참고용)</div>
      <div class="value" style="color:var(--inkSoft)">${annualAch==null?"—":annualAch.toFixed(1)+"%"}</div>
      <div class="sub">연간 총목표 대비 — 하반기 미도래분 포함, 낮게 보임</div>
    </div>
    <div class="panel card">
      <div class="label">${MONTHS[asOfMonth]} 일할 페이스</div>
      <div class="value" style="color:${paceColor(curMonthPace)}">${curMonthPace==null?"—":curMonthPace.toFixed(0)+"%"}</div>
      <div class="sub">${asOfDay}일/${dim}일 경과 기준 기대치 대비</div>
    </div>
    <div class="panel card">
      <div class="label">ASP (실적 vs 목표)</div>
      <div class="value" style="color:var(--navy)">${aspActual==null?"—":cur(aspActual)}</div>
      <div class="sub">${aspBudget==null?"":"목표 ASP "+cur(aspBudget)}</div>
    </div>
  `;

  // Mini row
  const gapData = computeGapData(category, asOfMonth);
  const ytdGapStat = gapData
    ? (gapData.ytdGapUnits > 0
        ? `<span style="color:var(--bad)">+${gapData.ytdGapUnits.toLocaleString("en-US")}개</span>`
        : `<span style="color:var(--good)">달성</span>`)
    : `<span style="color:var(--inkSoft)">—</span>`;
  document.getElementById("miniRow").innerHTML = `
    <div class="mini"><div class="label">남은 목표</div><div class="value">${cur(remainingBudget)}</div></div>
    <div class="mini"><div class="label">남은 개월</div><div class="value">${monthsLeft}개월</div></div>
    <div class="mini"><div class="label">원 예산 대비 필요 페이스</div><div class="value" style="color:${paceColor(requiredVsOriginal)}">${requiredVsOriginal==null?"—":requiredVsOriginal.toFixed(0)+"%"}</div></div>
    <div class="mini"><div class="label">YTD 수량 Ach%</div><div class="value" style="color:${paceColor(ytdAchUnit)}">${ytdAchUnit==null?"—":ytdAchUnit.toFixed(1)+"%"}</div></div>
    <div class="mini"><div class="label">YTD 부족 수량 (ASP 환산)</div><div class="value">${ytdGapStat}</div></div>
  `;

  document.getElementById("chartTitle").textContent = `월별 목표 vs 실적 (${catLabel} · ${currency.toUpperCase()})`;
  drawChart(budgetSet[currency], actualSet[currency], asOfMonth, currency);

  renderGapPanel(category, asOfMonth);

  // Table
  const unitLabel = currency === "krw" ? "(단위: 원)" : "(단위: USD)";
  document.getElementById("tableTitle").innerHTML = category==="total"
    ? "월별 실적 입력 (Coronary·Peripheral 각 탭에서 입력)"
    : `월별 실적 입력 — ${catLabel} <span class="unit">${unitLabel}</span>`;
  const tableArea = document.getElementById("tableArea");
  if(category === "total"){
    tableArea.innerHTML = `<div class="tabs-note">전체 탭은 조회 전용입니다. 실적을 입력하려면 상단에서 Coronary 또는 Peripheral을 선택하세요.</div>`;
  } else {
    tableArea.innerHTML = buildTableHTML(BUDGET[category], state.actual[category], currency, asOfMonth);
    bindTableInputs(category);
  }
}

function buildTableHTML(budget, actualObj, currency, asOfMonth){
  const cur = currency === "krw" ? fmtKRWPlain : fmtUSD;
  let head = `<tr><th></th>` + MONTHS.map((m,i)=>`<th class="${i===asOfMonth?'current':''}">${m}</th>`).join("") + `</tr>`;
  let rBudget = `<tr><td class="label">${currency.toUpperCase()} 목표</td>` + budget[currency].map(v=>`<td>${cur(v)}</td>`).join("") + `</tr>`;
  let rActual = `<tr><td class="label">${currency.toUpperCase()} 실적</td>` + budget[currency].map((_,i)=>{
    const fmt = currency === "usd" ? fmtInputUSD : fmtInputNum;
    return `<td><input type="text" inputmode="numeric" data-metric="${currency}" data-idx="${i}" value="${fmt(actualObj[currency][i])}" placeholder="—"></td>`;
  }).join("") + `</tr>`;
  let rAch = `<tr><td class="label">Ach%</td>` + budget[currency].map((b,i)=>{
    const a = actualObj[currency][i];
    const p = a==null ? null : (a/b)*100;
    return `<td style="color:${paceColor(p)}; font-weight:600;">${p==null?"—":p.toFixed(0)+"%"}</td>`;
  }).join("") + `</tr>`;
  let rUnitBudget = `<tr><td class="label sep">수량 목표</td>` + budget.unit.map(v=>`<td class="sep">${fmtUnit(v)}</td>`).join("") + `</tr>`;
  let rUnitActual = `<tr><td class="label">수량 실적</td>` + budget.unit.map((_,i)=>
    `<td><input type="text" inputmode="numeric" data-metric="unit" data-idx="${i}" value="${fmtInputUnit(actualObj.unit[i])}" placeholder="—"></td>`
  ).join("") + `</tr>`;
  return `<div class="table-scroll"><table><thead>${head}</thead><tbody>${rBudget}${rActual}${rAch}${rUnitBudget}${rUnitActual}</tbody></table></div>`;
}

function bindTableInputs(category){
  document.querySelectorAll('#tableArea input[data-metric]').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const metric = e.target.getAttribute('data-metric');
      const idx = Number(e.target.getAttribute('data-idx'));
      const raw = e.target.value.replace(/,/g, '').replace(/[^0-9.-]/g, '');
      state.actual[category][metric][idx] = raw === "" ? null : Number(raw);
      persist();
      render();
      // restore focus to the same cell after re-render
      const sel = `#tableArea input[data-metric="${metric}"][data-idx="${idx}"]`;
      const el = document.querySelector(sel);
      if(el){ el.focus(); const v=el.value; el.setSelectionRange(v.length, v.length); }
    });
  });
}

function renderGapPanel(category, asOfMonth){
  const panel = document.getElementById("gapPanel");

  if(category === "total"){
    panel.innerHTML = `<div class="gap-title">ASP 기준 추가 필요 판매량</div>
      <div class="gap-sub">Coronary/Peripheral 탭에서 카테고리별 ASP 기준으로 확인하세요 (전체 탭은 ASP가 카테고리마다 달라 합산이 부정확합니다).</div>`;
    return;
  }

  const { asp, gaps, currentMonth } = computeGapData(category, asOfMonth);
  const catLabel = category === "coronary" ? "Coronary" : "Peripheral";
  const curLabel = MONTHS[asOfMonth];

  let html = `<div class="gap-title">ASP 기준 추가 필요 판매량 — ${catLabel}</div>
    <div class="gap-sub">ASP ${asp.toLocaleString("ko-KR")}원 기준 · 목표 미달월의 매출 갭을 수량으로 환산</div>`;

  if(currentMonth == null){
    html += `<div class="gap-summary" style="background:#F4F2EC; border-color:var(--line);">
      <span class="txt">${curLabel} 실적이 아직 입력되지 않았습니다. 아래 표에 실적을 입력하면 이번 달 필요 판매량이 표시됩니다.</span>
    </div>`;
  } else if(currentMonth.units > 0){
    html += `<div class="gap-summary">
      <span class="num">+${currentMonth.units.toLocaleString("en-US")}개</span>
      <span class="txt">${curLabel} 목표 대비 부족한 매출(${currentMonth.gapKRW.toLocaleString("ko-KR")}원)을 이번 달 안에 메우려면 필요한 추가 판매량</span>
    </div>`;
  } else {
    html += `<div class="gap-summary" style="background:#EDF4EF; border-color:#D3E5D8;">
      <span class="num" style="color:var(--good)">✓</span>
      <span class="txt">${curLabel} 목표를 이미 달성했습니다 — 추가 필요 판매량 없음</span>
    </div>`;
  }

  if(gaps.length === 0){
    html += `<div class="gap-empty">월별 목표 미달 구간이 없습니다.</div>`;
  } else {
    const maxUnits = Math.max(...gaps.map(g=>g.units));
    html += gaps.map(g => {
      const pct = maxUnits ? (g.units/maxUnits)*100 : 0;
      const isCurrent = g.i === asOfMonth;
      return `<div class="gap-row">
        <div class="gap-month" style="${isCurrent?'color:var(--coral); font-weight:700;':''}">${MONTHS[g.i]}</div>
        <div class="gap-track"><div class="gap-fill" style="width:${pct}%; ${isCurrent?'background:var(--coral);':''}"></div></div>
        <div class="gap-num" style="${isCurrent?'color:var(--coral);':''}">+${g.units.toLocaleString("en-US")}개</div>
      </div>`;
    }).join("");
  }

  panel.innerHTML = html;
}

function computeGapData(category, asOfMonth){
  if(category === "total") return null;
  const asp = ASP_KRW[category];
  const budgetKRW = BUDGET[category].krw;
  const actualKRW = state.actual[category].krw;

  const gaps = [];
  for(let i=0;i<12;i++){
    const a = actualKRW[i];
    if(a==null) continue;
    const g = budgetKRW[i] - a;
    if(g > 0) gaps.push({ i, gapKRW: g, units: Math.ceil(g/asp) });
  }

  const ytdBudget = sum(budgetKRW.slice(0, asOfMonth+1));
  const ytdActual = sum(actualKRW.slice(0, asOfMonth+1).map(v=>v||0));
  const ytdGapKRW = ytdBudget - ytdActual;
  const ytdGapUnits = ytdGapKRW > 0 ? Math.ceil(ytdGapKRW/asp) : 0;

  const curActual = actualKRW[asOfMonth];
  const curBudget = budgetKRW[asOfMonth];
  let currentMonth = null;
  if(curActual != null){
    const g = curBudget - curActual;
    currentMonth = { gapKRW: g, units: g > 0 ? Math.ceil(g/asp) : 0 };
  }

  return { asp, gaps, ytdGapKRW, ytdGapUnits, currentMonth };
}

function drawChart(budgetArr, actualArr, asOfMonth, currency){
  const canvas = document.getElementById("chart");
  const dpr = window.devicePixelRatio || 1;
  const PANEL_PADDING = 32; // .panel has 16px padding on each side
  const cssW = canvas.parentElement.clientWidth - PANEL_PADDING;
  const cssH = 260;
  canvas.style.width = cssW+"px";
  canvas.style.height = cssH+"px";
  canvas.width = cssW*dpr;
  canvas.height = cssH*dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  const padL = 46, padR = 6, padT = 18, padB = 26;
  const plotW = cssW - padL - padR;
  const plotH = cssH - padT - padB;
  const maxVal = Math.max(...budgetArr, ...actualArr.map(v=>v||0)) * 1.15;
  const n = 12;
  const groupW = plotW/n;
  const barW = groupW*0.32;

  // gridlines
  ctx.strokeStyle = "#E3E0D6";
  ctx.lineWidth = 1;
  ctx.fillStyle = "#5B6478";
  ctx.font = "11px Inter, sans-serif";
  const ySteps = 4;
  for(let s=0;s<=ySteps;s++){
    const y = padT + plotH - (plotH/ySteps)*s;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cssW-padR,y); ctx.stroke();
    const val = (maxVal/ySteps)*s;
    const label = currency==="krw" ? (val/1e6).toFixed(0)+"M" : (val/1e3).toFixed(0)+"K";
    ctx.fillText(label, 4, y+4);
  }

  for(let i=0;i<n;i++){
    const gx = padL + i*groupW;
    const bH = (budgetArr[i]/maxVal)*plotH;
    ctx.fillStyle = "#E3E0D6";
    ctx.fillRect(gx + groupW*0.14, padT+plotH-bH, barW, bH);
    if(actualArr[i]!=null){
      const aH = (actualArr[i]/maxVal)*plotH;
      ctx.fillStyle = "#4E7AA7";
      ctx.fillRect(gx + groupW*0.14 + barW + 4, padT+plotH-aH, barW, aH);
    }
    ctx.fillStyle = i===asOfMonth ? "#C97B63" : "#5B6478";
    ctx.font = i===asOfMonth ? "bold 11px Inter, sans-serif" : "11px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(MONTHS[i], gx+groupW/2, cssH-8);
  }
  ctx.textAlign = "left";

  // legend — top right, above DEC
  ctx.font="11px Inter, sans-serif";
  const swatch = 10, gap = 4, groupGap = 16;
  const budgetW = swatch + gap + ctx.measureText("Budget").width;
  const actualW = swatch + gap + ctx.measureText("Actual").width;
  const legendRight = cssW - padR;
  const actualStart = legendRight - actualW;
  const budgetStart = actualStart - groupGap - budgetW;
  ctx.fillStyle = "#E3E0D6"; ctx.fillRect(budgetStart, 2, swatch, swatch);
  ctx.fillStyle = "#5B6478"; ctx.fillText("Budget", budgetStart+swatch+gap, 11);
  ctx.fillStyle = "#4E7AA7"; ctx.fillRect(actualStart, 2, swatch, swatch);
  ctx.fillStyle = "#5B6478"; ctx.fillText("Actual", actualStart+swatch+gap, 11);
}

// ---------- Events ----------
document.getElementById("segCategory").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.category = b.getAttribute("data-cat"); render();
});
document.getElementById("segCurrency").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.currency = b.getAttribute("data-cur"); render();
});
document.getElementById("asOfMonth").addEventListener("change", e=>{
  state.asOfMonth = Number(e.target.value); render();
});
document.getElementById("asOfDay").addEventListener("input", e=>{
  state.asOfDay = Number(e.target.value)||1; render();
});
window.addEventListener("resize", ()=> render());

render();
</script>
